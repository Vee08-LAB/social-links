
<!DOCTYPE html>
<html lang="en">
                                        
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Frontend Mentor  | Social Links</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #141414;
            font-family: Arial, sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile {
            background-color: #1f1f1f;
            width: 350px;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
        }

        .avatar {
           width: 85px;
           height: 85px;
           border-radius: 50%;
           object-fit: cover;
           margin: 0 auto 25px;
           display: block;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .location {
            color: #c5f82a;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .bio {
            font-size: 14px;
            margin-bottom: 25px;
        }

        .links a {
            display: block;
            background-color: #333333;
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 14px;
        }

        .links a:hover {
            background-color: #c5f82a;
            color: #141414;
            cursor: pointer;
        }

        .attribution {
            font-size: 0.6875rem;
            text-align: center; 
            color: hsl(228, 45%, 44%); 
            position: absolute;
            bottom: 10px;
        }

        .attribution a {
            color: #c5f82a;
        }

        @media (max-width: 400px) {
            .profile {
                width: 90%;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="profile">

        <img src="./assets/images/avatar-jessica.jpeg"
     alt="Profile picture"
     class="avatar">

        <h2>Jessica Randall</h2>

        <p class="location">London, United Kingdom</p>

        <p class="bio">
            "Front-end developer and avid reader."
        </p>

        <div class="links">
            <a href="https://github.com/Vee08-LAB" target="_blank">GitHub</a>

            <a href="#" target="_blank">Frontend Mentor</a>

            <a href="#" target="_blank">LinkedIn</a>

            <a href="#" target="_blank">Twitter</a>

            <a href="#" target="_blank">Instagram</a>
        </div>

    </div>

    <footer class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge">
            Frontend Mentor
        </a>.
        Coded by <a href="#">CIPHER VEE08-LAB</a>.
    </footer>

</body>
</html>
